name: Probe lineups
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe match detail for lineups
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -e
          M=$(curl -sS -H "X-Auth-Token: $TOKEN" "https://api.football-data.org/v4/competitions/WC/matches")
          ID=$(echo "$M" | jq -r '([.matches[] | select(.status=="FINISHED")][0].id) // .matches[0].id')
          echo "Probing match id: $ID"
          D=$(curl -sS -H "X-Auth-Token: $TOKEN" "https://api.football-data.org/v4/matches/$ID")
          echo "=== top-level keys ==="
          echo "$D" | jq -r 'keys'
          echo "=== error fields (if any) ==="
          echo "$D" | jq -rc '{errorCode: (.errorCode // null), message: (.message // null)}'
          echo "=== homeTeam keys ==="
          echo "$D" | jq -rc '(.homeTeam // {}) | keys'
          echo "=== lineup length home / away ==="
          echo "$D" | jq -r '((.homeTeam.lineup // [])|length), ((.awayTeam.lineup // [])|length)'
          echo "=== sample home lineup entry ==="
          echo "$D" | jq -rc '((.homeTeam.lineup // [])[0]) // "NO LINEUP DATA"'
