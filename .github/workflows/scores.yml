name: Update scores
on:
  schedule:
    # Offset off the :00/:05 boundary — GitHub drops crons that land on the
    # congested top-of-5-minute slots. Runs at :02,:07,:12,… every 5 min.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zealous-pasteur-mwkrU

      - name: Fetch scores
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -e
          RESP=$(curl -sS -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/competitions/WC/matches" || echo '{}')
          if ! echo "$RESP" | jq -e '.matches' > /dev/null 2>&1; then
            echo "API did not return matches. Response:"
            echo "$RESP" | head -c 400
            exit 0
          fi
          echo "$RESP" | jq '[.matches[] | {
            home: .homeTeam.name,
            away: .awayTeam.name,
            utcDate: .utcDate,
            status: .status,
            minute: .minute,
            score: [.score.fullTime.home, .score.fullTime.away]
          }]' > scores.json
          echo "Wrote $(jq length scores.json) matches"

      - name: Commit if changed
        run: |
          git config user.name "scores-bot"
          git config user.email "scores-bot@users.noreply.github.com"
          if [[ -n "$(git status -s scores.json)" ]]; then
            git add scores.json
            git commit -m "chore: update scores [skip ci]"
            git push origin HEAD:claude/zealous-pasteur-mwkrU
          else
            echo "No score changes."
          fi
